name: Eddy

options:
  bundleIdPrefix: app.eddyhq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES

targets:
  Eddy:
    type: application
    platform: iOS
    sources:
      - path: Eddy
        excludes:
          - Info.plist
          - Eddy.entitlements
      # Compiled into both targets rather than linked as a framework: two
      # small targets sharing a handful of files don't need a module boundary,
      # and the app's unit tests keep reaching it through @testable import Eddy.
      - path: Shared
    dependencies:
      - target: EddyShare
        embed: true
      # Linked explicitly: without it the App Intents metadata processor finds
      # no framework dependency, skips extraction, and "Add to Eddy" never
      # shows up in Shortcuts.
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_NAME: Eddy
        PRODUCT_BUNDLE_IDENTIFIER: app.eddyhq.Eddy
        INFOPLIST_FILE: Eddy/Info.plist
        CODE_SIGN_ENTITLEMENTS: Eddy/Eddy.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      # XcodeGen's iOS target preset injects the legacy "iPhone Developer" into
      # both configs. Release stays on a development identity too: automatic
      # signing refuses a manually named distribution identity at archive
      # time. The distribution certificate and ad hoc profile are applied at
      # export, by scripts/release-adhoc.sh.
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Development

  EddyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: EddyShare
        excludes:
          - Info.plist
          - EddyShare.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: EddyShare
        PRODUCT_BUNDLE_IDENTIFIER: app.eddyhq.Eddy.Share
        # Shared/ compiles into both targets, so the guard has to be here: the
        # first UIApplication.shared added for the app's benefit becomes a
        # build error in the extension rather than a runtime surprise.
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_FILE: EddyShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: EddyShare/EddyShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Development

  EddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EddyTests
    dependencies:
      - target: Eddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.eddyhq.EddyTests
        GENERATE_INFOPLIST_FILE: YES

  # The one thing unit tests can't reach: whether Eddy actually appears in a
  # real share sheet and whether the extension process can read the app's
  # keychain item. Deliberately out of the Eddy scheme's test action — it
  # drives Safari, takes a minute, and is run by hand (see README).
  EddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EddyUITests
    dependencies:
      - target: Eddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.eddyhq.EddyUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Eddy

schemes:
  Eddy:
    build:
      targets:
        Eddy: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - EddyTests

  EddyUITests:
    build:
      targets:
        Eddy: all
        EddyUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - EddyUITests
