# nginx config for Eddy video serving
# Place at: /etc/nginx/sites-available/eddy-videos
# Enable: sudo ln -s /etc/nginx/sites-available/eddy-videos /etc/nginx/sites-enabled/
# Reload:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Video files — served directly from SSD, no transcoding
    location /videos/ {
        alias /mnt/ssd/eddy/videos/;

        # Allow range requests for video seeking
        add_header Accept-Ranges bytes;

        # CORS for PWA (same Tailscale network)
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

        # Cache control — videos don't change once written
        add_header Cache-Control "public, max-age=86400";

        # Only serve mp4 files; return 403 for anything else
        location ~ \.(mp4)$ {
            try_files $uri =404;
        }
        location ~ [^/]$ {
            if ($uri !~ \.mp4$) {
                return 403;
            }
        }
    }

    # Stylised thumbnails — generated post-download, kept forever
    location /thumbs/ {
        alias /mnt/ssd/eddy/thumbs/;

        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Cache-Control "no-cache";

        location ~ \.(webp)$ {
            try_files $uri =404;
        }
        location ~ [^/]$ {
            if ($uri !~ \.webp$) {
                return 403;
            }
        }
    }

    # Block directory listing
    autoindex off;
}
