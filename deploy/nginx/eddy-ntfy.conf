# nginx HTTPS reverse proxy for ntfy
# Provides valid TLS required by the ntfy iOS app for upstream push registration
# Cert: Tailscale MagicDNS cert for mediaserver.tail1b6462.ts.net
# Setup: run deploy/setup-ubuntu.sh to obtain cert and enable this config

server {
    listen 443 ssl;
    server_name mediaserver.tail1b6462.ts.net;

    ssl_certificate     /etc/ssl/eddy/ntfy.crt;
    ssl_certificate_key /etc/ssl/eddy/ntfy.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:2586;
        proxy_http_version 1.1;

        # WebSocket + SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering — required for SSE event streaming
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
