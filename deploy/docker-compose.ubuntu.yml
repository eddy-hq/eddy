services:
  redis:
    image: redis:7-alpine
    container_name: eddy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: eddy-ntfy
    restart: unless-stopped
    ports:
      - "2586:80"
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
    command: serve
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
  ntfy-cache:
